<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>眨显 · Inspiration</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:        #fafaf8;
    --card-bg:   #ffffff;
    --text:      #2d2d2d;
    --text-mid:  #6e6e6e;
    --text-light:#999999;
    --border:    #e8e6e1;
    --accent:    #7b8fa1;
    --accent2:   #8b9d83;
    --tag-bg:    #f0efeb;
    --tag-text:  #6b7f8e;
    --shadow:    0 1px 2px rgba(0,0,0,0.03);
    --shadow-md: 0 6px 24px rgba(0,0,0,0.05);
    --radius:    12px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 100px;
  }

  /* ── Top bar ── */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(250,250,248,0.82);
    backdrop-filter: saturate(180%) blur(16px);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 12px 0;
  }
  .topbar-inner {
    max-width: 1120px; margin: 0 auto; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo {
    display: flex; align-items: center; gap: 9px;
    color: var(--text);
    user-select: none;
  }
  .logo-mark {
    width: 28px; height: 28px;
    background: #2d2d2d;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo-mark svg { width: 16px; height: 16px; }
  .logo-word {
    font-size: 19px; font-weight: 600;
    letter-spacing: -0.2px;
    color: #2d2d2d;
  }

  /* ── Search ── */
  .search-wrap { position: relative; }
  .search-wrap input {
    padding: 9px 14px 9px 36px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 24px;
    background: var(--card-bg); color: var(--text);
    outline: none; width: 220px; transition: all 0.3s; font-family: inherit;
  }
  .search-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(123,143,161,0.10);
    width: 260px;
  }
  .search-wrap .search-icon {
    position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%); font-size: 14px;
    color: var(--text-light); pointer-events: none;
  }

  /* ── Categories ── */
  .categories { display: flex; gap: 8px; flex-wrap: wrap; }
  .cat-chip {
    padding: 7px 18px; font-size: 13px; font-weight: 500;
    border-radius: 20px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--text-mid);
    cursor: pointer; transition: all 0.25s; white-space: nowrap;
    font-family: inherit;
  }
  .cat-chip:hover { border-color: var(--accent); color: var(--accent); }
  .cat-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── Main ── */
  .main { max-width: 1120px; margin: 0 auto; padding: 32px 24px; }

  .section-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 24px;
  }
  .section-header h2 { font-size: 18px; font-weight: 600; letter-spacing: 0.3px; }
  .section-header .count { font-size: 13px; color: var(--text-light); }

  /* ── Masonry ── */
  .masonry { columns: 4; column-gap: 20px; }
  .card {
    break-inside: avoid; margin-bottom: 20px;
    background: var(--card-bg); border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform 0.35s ease, box-shadow 0.35s ease;
    cursor: default;
    animation: fadeUp 0.5s ease backwards;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card-img { width: 100%; display: block; background: #eae8e4; }
  .card-body { padding: 18px 18px 16px; }
  .card-body h3 {
    font-size: 16px; font-weight: 600; letter-spacing: 0.2px;
    margin-bottom: 6px; line-height: 1.4;
  }
  .card-body .desc {
    font-size: 13px; color: var(--text-mid); line-height: 1.6;
    margin-bottom: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .card-tags .tag {
    font-size: 11px; padding: 4px 10px;
    background: var(--tag-bg); color: var(--tag-text);
    border-radius: 10px; font-weight: 500;
  }

  /* ── Publish FAB ── */
  .fab {
    position: fixed; bottom: 40px; right: 30px; z-index: 200;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: #fff;
    border: none; box-shadow: 0 4px 16px rgba(123,143,161,0.35);
    font-size: 28px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .fab:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(123,143,161,0.5); }
  .fab:active { transform: scale(0.95); }

  /* ── Modal overlay ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
    padding: 20px;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }

  .modal {
    background: #fff; border-radius: 18px;
    padding: 36px 30px 28px; width: 100%; max-width: 460px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.12);
    transform: translateY(20px);
    transition: transform 0.35s ease;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal h3 {
    font-size: 20px; font-weight: 600; letter-spacing: 0.3px;
    margin-bottom: 24px; text-align: center;
  }
  .modal .field { margin-bottom: 16px; }
  .modal .field label {
    display: block; font-size: 13px; font-weight: 600;
    color: var(--text-mid); margin-bottom: 5px;
  }
  .modal .field input,
  .modal .field select,
  .modal .field textarea {
    width: 100%; padding: 11px 14px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 10px;
    background: #fafaf8; color: var(--text);
    outline: none; font-family: inherit;
    transition: border-color 0.25s;
  }
  .modal .field input:focus,
  .modal .field select:focus,
  .modal .field textarea:focus {
    border-color: var(--accent);
  }
  .modal .field textarea { resize: vertical; min-height: 80px; }
  .modal .field .hint { font-size: 11px; color: var(--text-light); margin-top: 3px; }
  .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
  .modal-btns button {
    flex: 1; padding: 12px; font-size: 15px; font-weight: 600;
    border-radius: 10px; cursor: pointer; border: none; font-family: inherit;
    transition: opacity 0.2s;
  }
  .modal-btns .btn-cancel { background: #f0efeb; color: var(--text-mid); }
  .modal-btns .btn-submit { background: var(--accent); color: #fff; }
  .modal-btns button:hover { opacity: 0.85; }

  /* ── Bottom nav ── */
  .bottom-nav {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: rgba(255,255,255,0.88);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--border);
    padding: 6px 0 env(safe-area-inset-bottom);
  }
  .bottom-nav .nav-items { display: flex; justify-content: space-around; }
  .bottom-nav .nav-item {
    display: flex; flex-direction: column; align-items: center;
    font-size: 11px; color: var(--text-light); gap: 2px;
    cursor: pointer; padding: 4px 12px; transition: color 0.2s;
  }
  .bottom-nav .nav-item.active { color: var(--accent); }
  .bottom-nav .nav-item .nav-icon { font-size: 20px; }

  /* ── Toast ── */
  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    z-index: 500;
    background: #2d2d2d; color: #fff;
    padding: 10px 24px; border-radius: 20px;
    font-size: 14px; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s;
  }
  .toast.show { opacity: 1; }

  /* ── Empty ── */
  .empty-state {
    text-align: center; padding: 80px 20px; color: var(--text-light);
  }
  .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.6; }
  .empty-state p { font-size: 15px; }

  /* ── Back to top ── */
  .back-top {
    position: fixed; bottom: 110px; right: 30px; z-index: 90;
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--card-bg); border: 1px solid var(--border);
    box-shadow: var(--shadow-md);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .back-top.visible { opacity: 1; pointer-events: auto; }

  /* ── Responsive ── */
  @media (max-width: 1024px) { .masonry { columns: 3; } }
  @media (max-width: 768px) {
    .masonry { columns: 2; column-gap: 12px; }
    .card { margin-bottom: 12px; }
    .search-wrap input { width: 150px; }
    .search-wrap input:focus { width: 170px; }
    .bottom-nav { display: block; }
    .fab { bottom: 80px; right: 16px; width: 50px; height: 50px; font-size: 24px; }
    .back-top { bottom: 150px; right: 18px; }
  }
  @media (max-width: 480px) {
    .masonry { columns: 2; column-gap: 10px; }
    .card { margin-bottom: 10px; }
    .card-body { padding: 12px; }
    .card-body h3 { font-size: 14px; }
    .topbar-inner { padding: 0 16px; }
    .main { padding: 20px 12px; }
    .search-wrap input { width: 120px; font-size: 13px; }
    .search-wrap input:focus { width: 140px; }
    .cat-chip { padding: 6px 14px; font-size: 12px; }
    .categories { gap: 6px; }
    .modal { padding: 24px 18px 20px; }
  }
</style>
</head>
<body>

<!-- Top bar -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="3" fill="#fff" opacity="0.9"/>
          <path d="M12 2 L13 10 L12 2" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
          <path d="M12 22 L11 14 L12 22" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
          <path d="M2 12 L10 11 L2 12" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
          <path d="M22 12 L14 13 L22 12" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
        </svg>
      </div>
      <span class="logo-word">眨显</span>
    </div>
    <div class="search-wrap">
      <span class="search-icon">&#9740;</span>
      <input type="text" id="searchInput" placeholder="搜索灵感..." autocomplete="off">
    </div>
  </div>
</header>

<main class="main">
  <div class="section-header">
    <h2 id="sectionTitle">发现灵感</h2>
    <span class="count" id="resultCount"></span>
  </div>
  <div class="categories" id="categories" style="margin-bottom:28px;">
    <span class="cat-chip active" data-cat="all">全部</span>
    <span class="cat-chip" data-cat="计划">计划</span>
    <span class="cat-chip" data-cat="目标">目标</span>
    <span class="cat-chip" data-cat="出行">出行</span>
    <span class="cat-chip" data-cat="设计">设计</span>
  </div>

  <div class="masonry" id="masonry"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-icon">&#9740;</div>
    <p>没有找到相关灵感</p>
  </div>
</main>

<!-- Bottom nav -->
<nav class="bottom-nav">
  <div class="nav-items">
    <div class="nav-item active" data-cat="all">  <span class="nav-icon">&#9740;</span> 首页   </div>
    <div class="nav-item" data-cat="计划">       <span class="nav-icon">&#10063;</span> 计划   </div>
    <div class="nav-item" data-cat="目标">       <span class="nav-icon">&#9733;</span> 目标   </div>
    <div class="nav-item" data-cat="出行">       <span class="nav-icon">&#9740;</span> 出行   </div>
    <div class="nav-item" data-cat="设计">       <span class="nav-icon">&#9998;</span> 设计   </div>
  </div>
</nav>

<!-- FAB -->
<button class="fab" id="fab" title="发布灵感">+</button>

<!-- Back to top -->
<div class="back-top" id="backTop">&#8593;</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>&#9998; 记录灵感</h3>
    <div class="field">
      <label>标题</label>
      <input type="text" id="pubTitle" placeholder="给灵感取个名字" maxlength="40">
    </div>
    <div class="field">
      <label>描述</label>
      <textarea id="pubDesc" placeholder="描述一下这个灵感..." maxlength="200"></textarea>
    </div>
    <div class="field">
      <label>分类</label>
      <select id="pubCat">
        <option value="计划">计划</option>
        <option value="目标">目标</option>
        <option value="出行">出行</option>
        <option value="设计">设计</option>
      </select>
    </div>
    <div class="field">
      <label>图片链接（可选）</label>
      <input type="text" id="pubImg" placeholder="https://...">
      <div class="hint">留空将自动使用随机图片</div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="btnCancel">取消</button>
      <button class="btn-submit" id="btnSubmit">发布</button>
    </div>
  </div>
</div>

<script>
// ── Data ──
function loadAll() {
  try {
    return JSON.parse(localStorage.getItem('inspire_cards') || '[]');
  } catch { return []; }
}

let currentCat = "all";
let currentSearch = "";

const masonry = document.getElementById('masonry');
const empty   = document.getElementById('emptyState');
const countEl = document.getElementById('resultCount');
const titleEl = document.getElementById('sectionTitle');

function getFiltered() {
  const all = loadAll();
  return all.filter(c => {
    const mCat = currentCat === "all" || c.tags.some(t => t === currentCat);
    const mSearch = !currentSearch || c.t.includes(currentSearch) || c.d.includes(currentSearch) || c.tags.some(t => t.includes(currentSearch));
    return mCat && mSearch;
  });
}

function render() {
  const list = getFiltered();
  masonry.innerHTML = '';
  if (list.length === 0) {
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    list.forEach((c, i) => {
      const el = document.createElement('div');
      el.className = 'card';
      el.style.animationDelay = `${i * 0.03}s`;
      el.innerHTML = `
        <img class="card-img" src="${c.img}" alt="${c.t}" loading="lazy" onerror="this.src='https://picsum.photos/seed/fallback${i}/600/500'">
        <div class="card-body">
          <h3>${c.t}</h3>
          <p class="desc">${c.d}</p>
          <div class="card-tags">${c.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        </div>`;
      masonry.appendChild(el);
    });
  }
  const labels = { all:'发现灵感', 计划:'计划', 目标:'目标', 出行:'出行', 设计:'设计' };
  titleEl.textContent = labels[currentCat] || '发现灵感';
  countEl.textContent = `${list.length} 条灵感`;
}

// ── Category ──
function setCategory(cat) {
  currentCat = cat;
  document.querySelectorAll('.cat-chip').forEach(el => el.classList.toggle('active', el.dataset.cat === cat));
  document.querySelectorAll('.bottom-nav .nav-item').forEach(el => el.classList.toggle('active', el.dataset.cat === cat));
  render();
}

document.getElementById('categories').addEventListener('click', e => {
  if (e.target.classList.contains('cat-chip')) setCategory(e.target.dataset.cat);
});
document.querySelector('.bottom-nav').addEventListener('click', e => {
  const item = e.target.closest('.nav-item');
  if (item) { setCategory(item.dataset.cat); window.scrollTo({ top: 0, behavior: 'smooth' }); }
});

// ── Search ──
const searchInput = document.getElementById('searchInput');
let searchTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { currentSearch = searchInput.value.trim(); render(); }, 300);
});

// ── Modal / Publish ──
const overlay  = document.getElementById('modalOverlay');
const fab      = document.getElementById('fab');
const btnCancel = document.getElementById('btnCancel');
const btnSubmit = document.getElementById('btnSubmit');

fab.addEventListener('click', () => overlay.classList.add('open'));
btnCancel.addEventListener('click', () => { overlay.classList.remove('open'); clearForm(); });
overlay.addEventListener('click', e => { if (e.target === overlay) { overlay.classList.remove('open'); clearForm(); } });

function clearForm() {
  document.getElementById('pubTitle').value = '';
  document.getElementById('pubDesc').value = '';
  document.getElementById('pubCat').value = '计划';
  document.getElementById('pubImg').value = '';
}

btnSubmit.addEventListener('click', () => {
  const title = document.getElementById('pubTitle').value.trim();
  const desc  = document.getElementById('pubDesc').value.trim();
  const cat   = document.getElementById('pubCat').value;
  let img     = document.getElementById('pubImg').value.trim();

  if (!title) { showToast('请输入标题'); return; }
  if (!desc)  { showToast('请输入描述'); return; }
  if (!img) { img = `https://picsum.photos/seed/u${Date.now()}/600/600`; }

  const card = { img, t: title, d: desc, tags: [cat] };

  try {
    const saved = JSON.parse(localStorage.getItem('inspire_cards') || '[]');
    saved.unshift(card);
    localStorage.setItem('inspire_cards', JSON.stringify(saved));
  } catch {}

  overlay.classList.remove('open');
  clearForm();
  setCategory(cat);
  showToast('灵感发布成功 ✦');
});

// ── Toast ──
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ── Back to top ──
const backTop = document.getElementById('backTop');
window.addEventListener('scroll', () => backTop.classList.toggle('visible', window.scrollY > 600));
backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

// ── Init ──
render();
</script>

</body>
</html>
